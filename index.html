<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zusers einzigartiger Bierkeller</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Advent+Pro:wght@300;400&family=JetBrains+Mono:wght@400;500&family=Lora:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Ropa+Sans:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root {
    /* Zusers Farbwelt */
    --paper: #F0EDE8;         /* Leinen weiß */
    --paper-2: #E7E3DC;       /* leicht abgesetzt */
    --paper-3: #DDD8CE;       /* Hover / stärker abgesetzt */
    --ink: #212121;           /* Dunkelgrau */
    --ink-mute: #7a7a7a;      /* Grau mittel */
    --ink-soft: #929292;      /* Hellgrau */
    --ink-hint: #8d8d8d;      /* Zwischenton */
    --forest: #005238;        /* Dunkelgrün – Primärfarbe */
    --forest-2: #016b4A;      /* etwas heller */
    --gold: #c39e6d;          /* Gold – Akzent */
    --gold-soft: #EDE1CE;     /* helles Gold für Flächen */
    --rule: #C8C3B8;          /* Linien / Ränder auf Leinen */
    --danger: #8B3A2E;
    --success: #005238;

    /* Kompatibilitäts-Aliase (interne Referenzen) */
    --bottle: var(--forest);
    --bottle-2: var(--forest-2);
    --amber: var(--gold);
    --amber-soft: var(--gold-soft);

    /* Schriften */
    --font-display: 'Lora', 'Minion Pro', Georgia, serif;
    --font-body: 'Ropa Sans', 'DIN Next', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    --font-light: 'Advent Pro', 'Ropa Sans', sans-serif;
    --font-mono: 'JetBrains Mono', 'SF Mono', Consolas, monospace;
    --radius: 3px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: 14px; line-height: 1.5; min-height: 100vh; }
  body { background-image: radial-gradient(ellipse at top, rgba(184,134,59,0.05), transparent 60%); }

  .app { max-width: 1180px; margin: 0 auto; padding: 24px 32px 60px; }

  header.masthead {
    border-bottom: 1px solid var(--rule);
    padding-bottom: 18px; margin-bottom: 26px;
    position: sticky; top: 0; z-index: 100;
    background: var(--paper-2);
  }
  .masthead-top {
    display: flex; align-items: center; gap: 20px;
    margin-bottom: 16px; flex-wrap: wrap;
  }
  .logo-riedberg {
    height: 94px; width: auto; flex-shrink: 0; display: block;
  }
  .logo-karl {
    height: 82px; width: auto; flex-shrink: 0;
    margin-left: auto;
    align-self: flex-start;
    transform: rotate(-15deg);
    transform-origin: center;
    filter: drop-shadow(0 3px 6px rgba(0,82,56,0.18));
    transition: transform .25s ease;
  }
  .logo-karl:hover { transform: rotate(-15deg) scale(1.04); }
  @media (max-width: 720px) {
    .logo-riedberg { height: 66px; }
    .logo-karl { height: 62px; }
  }
  .brand { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  .brand-mark { font-family: var(--font-display); font-weight: 500; font-size: 35px; line-height: 1; color: var(--forest); letter-spacing: -0.005em; }
  .brand-mark em { font-style: italic; color: var(--gold); font-weight: 400; }
  .brand-sub { font-family: var(--font-light); font-weight: 300; font-size: 11px; letter-spacing: 0.24em; text-transform: uppercase; color: var(--ink-mute); padding-left: 14px; border-left: 1px solid var(--rule); }

  nav.tabs { display: flex; gap: 2px; flex-wrap: wrap; }
  .tab { font-family: var(--font-body); font-size: 13px; font-weight: 500; color: var(--ink-mute); background: transparent; border: 1px solid transparent; padding: 8px 14px; cursor: pointer; letter-spacing: 0.01em; transition: all .15s ease; border-radius: var(--radius); }
  .tab:hover { color: var(--ink); background: var(--paper-2); }
  .tab.active { color: var(--paper); background: var(--bottle); border-color: var(--bottle); }

  /* toolbar */
  .toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 20px; }
  input, select, textarea { font-family: var(--font-body); font-size: 13px; padding: 7px 10px; background: var(--paper-2); border: 1px solid var(--rule); color: var(--ink); border-radius: var(--radius); outline: none; }
  input:focus, select:focus, textarea:focus { border-color: var(--bottle); background: var(--paper); }
  input[type="search"] { min-width: 220px; }

  .btn { font-family: var(--font-body); font-size: 13px; font-weight: 500; padding: 7px 14px; border-radius: var(--radius); cursor: pointer; border: 1px solid transparent; transition: all .15s ease; letter-spacing: 0.01em; display: inline-flex; align-items: center; gap: 6px; text-decoration: none; }
  .btn-primary { background: var(--bottle); color: var(--paper); border-color: var(--bottle); }
  .btn-primary:hover { background: var(--bottle-2); }
  .btn-ghost { background: transparent; color: var(--ink); border-color: var(--rule); }
  .btn-ghost:hover { background: var(--paper-2); border-color: var(--ink-mute); }
  .btn-danger { background: transparent; color: var(--danger); border-color: var(--danger); }
  .btn-danger:hover { background: var(--danger); color: var(--paper); }
  .btn-untappd { background: #FFC000; color: #000; border-color: #FFC000; font-weight: 600; }
  .btn-untappd:hover { background: #E5AC00; }
  .spacer { flex: 1; }
  .count { font-size: 12px; color: var(--ink-mute); }

  /* filters */
  .filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  .filters select { flex: 1; min-width: 140px; }

  /* catalog list */
  .catalog { background: var(--paper-2); border: 1px solid var(--rule); border-radius: var(--radius); overflow: hidden; }
  .beer-row { padding: 12px 16px; border-bottom: 1px solid var(--rule); cursor: pointer; display: grid; grid-template-columns: 1fr auto; gap: 16px; align-items: center; transition: background .12s; }
  .beer-row:last-child { border-bottom: none; }
  .beer-row:hover { background: var(--paper-3); }
  .beer-head { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .beer-catno { font-family: var(--font-mono); font-size: 10px; color: var(--ink-soft); letter-spacing: 0.05em; }
  .beer-name { font-family: var(--font-display); font-weight: 500; font-size: 18px; line-height: 1.1; color: var(--ink); }
  .beer-vintage { font-family: var(--font-mono); font-size: 12px; color: var(--ink-mute); }
  .beer-sub { font-size: 12px; color: var(--ink-mute); margin-top: 2px; font-family: var(--font-display); font-style: italic; }
  .beer-tags { margin-top: 5px; display: flex; gap: 4px; flex-wrap: wrap; }
  .beer-right { text-align: right; font-size: 11px; color: var(--ink-mute); white-space: nowrap; font-family: var(--font-mono); }
  .beer-right .pos { color: var(--ink); }
  .beer-right .sub { color: var(--ink-soft); font-size: 10px; margin-top: 2px; }

  .badge { display: inline-block; font-size: 10px; padding: 1px 7px; border-radius: 10px; letter-spacing: 0.02em; }
  .badge.cat-karton { background: rgba(31,58,46,0.1); color: var(--bottle); }
  .badge.cat-magnum { background: rgba(139,58,46,0.1); color: var(--danger); }
  .badge.cat-spirit { background: rgba(184,134,59,0.15); color: var(--amber); }
  .badge.status-ok { background: rgba(59,109,17,0.1); color: var(--success); }
  .badge.status-vor { background: var(--amber-soft); color: #7A5A16; }
  .badge.status-neu { background: var(--paper-3); color: var(--ink-mute); }
  .badge.loc-bk { background: rgba(31,58,46,0.1); color: var(--bottle); }
  .badge.loc-bl { background: rgba(184,134,59,0.15); color: var(--amber); }
  .badge.public { background: var(--bottle); color: var(--paper); }

  .tag { font-size: 11px; background: var(--paper); padding: 1px 8px; border-radius: 10px; border: 1px solid var(--rule); color: var(--ink-mute); }
  .tag-count { font-size: 11px; color: var(--ink-soft); padding: 1px 4px; }

  .empty { padding: 60px 30px; text-align: center; background: var(--paper-2); border: 1px dashed var(--rule); border-radius: var(--radius); color: var(--ink-mute); }
  .empty-icon { font-size: 40px; margin-bottom: 8px; opacity: 0.4; }
  .empty h3 { font-family: var(--font-display); font-size: 22px; font-weight: 500; color: var(--ink); margin-bottom: 6px; }
  .empty p { font-size: 13px; margin-bottom: 16px; }
  .empty .actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }

  .load-more { padding: 12px; text-align: center; font-size: 12px; color: var(--ink-soft); background: var(--paper-3); border-top: 1px solid var(--rule); }

  /* Modal */
  .modal-bg { position: fixed; inset: 0; background: rgba(43,36,32,0.5); z-index: 100; display: none; align-items: flex-start; justify-content: center; padding: 40px 20px; overflow-y: auto; }
  .modal-bg.open { display: flex; }
  .modal { background: var(--paper); max-width: 720px; width: 100%; padding: 32px; border: 1px solid var(--rule); border-radius: var(--radius); box-shadow: 0 20px 60px rgba(43,36,32,0.3); max-height: 92vh; overflow-y: auto; }
  .modal-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 20px; padding-bottom: 14px; border-bottom: 1px solid var(--rule); }
  .modal-title { font-family: var(--font-display); font-size: 28px; font-weight: 500; color: var(--bottle); }
  .modal-close { background: transparent; border: none; font-size: 26px; cursor: pointer; color: var(--ink-mute); padding: 0 4px; line-height: 1; }
  .modal-close:hover { color: var(--ink); }

  form.beer-form { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  form.beer-form .full { grid-column: 1 / -1; }
  .field { display: flex; flex-direction: column; gap: 3px; }
  .field label { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-mute); }
  .field input, .field select, .field textarea { width: 100%; }
  .field textarea { min-height: 60px; resize: vertical; }
  .field .hint { font-size: 11px; color: var(--ink-soft); font-style: italic; }

  .checkbox { display: flex; align-items: center; gap: 8px; cursor: pointer; padding: 8px 12px; background: var(--paper-2); border: 1px solid var(--rule); border-radius: var(--radius); font-size: 13px; }
  .checkbox input { width: 16px; height: 16px; accent-color: var(--bottle); }

  .form-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--rule); grid-column: 1 / -1; }

  /* Detail */
  .detail-actions { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .detail { background: var(--paper-2); border: 1px solid var(--rule); border-radius: var(--radius); padding: 28px; }
  .detail-meta { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; font-family: var(--font-mono); font-size: 11px; color: var(--ink-mute); }
  .detail-title { font-family: var(--font-display); font-size: 36px; font-weight: 500; line-height: 1.05; color: var(--bottle); }
  .detail-title .year { color: var(--ink-mute); font-weight: 400; font-size: 28px; }
  .detail-brewery { font-family: var(--font-display); font-style: italic; font-size: 18px; color: var(--ink-mute); margin-top: 4px; }

  .detail-cta { margin-top: 16px; }

  .detail-facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 14px; margin: 24px 0; padding: 20px 0; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); }
  .fact-label { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-mute); }
  .fact-value { font-family: var(--font-display); font-size: 18px; font-weight: 500; margin-top: 2px; color: var(--ink); }
  .fact-value.mono { font-family: var(--font-mono); font-size: 13px; font-weight: 400; }

  .section-title { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--bottle); margin: 20px 0 8px; }
  .pairing-chip { background: var(--bottle); color: var(--paper); padding: 4px 10px; font-size: 12px; border-radius: var(--radius); display: inline-block; margin: 2px; }
  .notes { font-family: var(--font-display); font-size: 15px; line-height: 1.6; }

  .photo-thumb { max-width: 100%; max-height: 320px; border: 1px solid var(--rule); border-radius: var(--radius); margin-top: 16px; }
  .photo-ref { font-family: var(--font-mono); font-size: 11px; color: var(--ink-mute); margin-top: 12px; padding: 8px 12px; background: var(--paper); border: 1px dashed var(--rule); border-radius: var(--radius); }

  /* Pairing search */
  .pairing-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  @media (max-width: 780px) { .pairing-grid { grid-template-columns: 1fr; } }
  .pairing-col { background: var(--paper-2); border: 1px solid var(--rule); border-radius: var(--radius); padding: 22px; }
  .pairing-col h3 { font-family: var(--font-display); font-size: 22px; font-weight: 500; color: var(--bottle); margin-bottom: 4px; }
  .pairing-col .desc { font-family: var(--font-display); font-style: italic; font-size: 13px; color: var(--ink-mute); margin-bottom: 14px; }
  .pairing-col input { width: 100%; padding: 10px 12px; font-size: 14px; background: var(--paper); }
  .pairing-result { padding: 10px 0; border-bottom: 1px solid var(--rule); cursor: pointer; }
  .pairing-result:last-child { border-bottom: none; }
  .pairing-result:hover { background: var(--paper); padding: 10px 8px; margin: 0 -8px; }
  .pairing-result-name { font-family: var(--font-display); font-size: 16px; font-weight: 500; }
  .pairing-result-meta { font-family: var(--font-mono); font-size: 11px; color: var(--ink-soft); margin-top: 2px; }

  /* Stats */
  .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; margin-bottom: 24px; }
  .stat-card { background: var(--paper-2); padding: 18px 20px; border: 1px solid var(--rule); border-left: 3px solid var(--bottle); border-radius: var(--radius); }
  .stat-card.amber { border-left-color: var(--amber); }
  .stat-label { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-mute); }
  .stat-value { font-family: var(--font-display); font-size: 34px; font-weight: 500; line-height: 1; margin-top: 4px; color: var(--bottle); }
  .stat-value .unit { font-size: 16px; color: var(--ink-mute); font-style: italic; }

  .breakdown-title { font-family: var(--font-display); font-size: 22px; font-weight: 500; color: var(--bottle); margin: 24px 0 12px; }
  .breakdown-title .sub { font-size: 12px; color: var(--ink-soft); font-family: var(--font-body); font-weight: 400; margin-left: 6px; }
  .breakdown { background: var(--paper-2); border: 1px solid var(--rule); border-radius: var(--radius); overflow: hidden; }
  .breakdown-row { display: grid; grid-template-columns: 180px 1fr 50px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--rule); gap: 14px; }
  .breakdown-row:last-child { border-bottom: none; }
  .breakdown-label { font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .breakdown-bar { height: 5px; background: var(--paper); border-radius: 3px; overflow: hidden; }
  .breakdown-bar-fill { height: 100%; background: var(--bottle); }
  .breakdown-bar-fill.amber { background: var(--amber); }
  .breakdown-count { text-align: right; font-family: var(--font-mono); font-size: 12px; color: var(--ink-mute); }

  .status-pills { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0 20px; }

  /* Public preview */
  .public-list { background: var(--paper); padding: 24px; border: 1px solid var(--rule); border-radius: var(--radius); margin-top: 16px; }
  .public-item { padding: 14px 0; border-bottom: 1px solid var(--rule); }
  .public-item:last-child { border-bottom: none; }
  .public-item-head { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
  .public-item-name { font-family: var(--font-display); font-size: 18px; font-weight: 500; }
  .public-item-year { font-family: var(--font-mono); font-size: 12px; color: var(--ink-mute); }
  .public-item-brewery { font-family: var(--font-display); font-style: italic; color: var(--ink-mute); font-size: 13px; margin-top: 2px; }
  .public-item-pair { margin-top: 6px; font-size: 12px; color: var(--ink-mute); }
  .public-item-pair .lbl { text-transform: uppercase; letter-spacing: 0.08em; font-size: 10px; }

  /* Grundriss */
  .floor-plan-wrap { margin: 0 0 32px; }
  .floor-plan { max-width: 420px; width: 100%; height: auto; display: block; margin: 0 auto; border: 1px solid var(--rule); border-radius: var(--radius); background: var(--paper); }
  .floor-plan .shelf-link { cursor: pointer; transition: all .15s ease; }
  .floor-plan .shelf-link:hover rect { stroke: var(--amber); stroke-width: 4; }
  .floor-plan-caption { text-align: center; font-size: 12px; color: var(--ink-mute); margin: 10px 0 0; font-style: italic; font-family: var(--font-display); }

  /* Raumumschalter und Akkordion */
  .room-selector {
    display: inline-flex; gap: 3px; padding: 4px;
    background: var(--paper-2); border-radius: 6px;
    margin-bottom: 22px;
  }
  .room-btn {
    padding: 8px 18px;
    background: transparent; border: none; cursor: pointer;
    font-family: var(--font-body); font-size: 13px; font-weight: 500;
    color: var(--ink-mute);
    border-radius: 4px;
    transition: all .15s ease;
    display: inline-flex; align-items: center; gap: 8px;
  }
  .room-btn:hover { color: var(--ink); background: rgba(0,0,0,0.03); }
  .room-btn.active {
    background: var(--forest); color: var(--paper);
    box-shadow: 0 1px 2px rgba(0,82,56,0.15);
  }
  .room-btn .badge {
    font-family: var(--font-mono); font-size: 10px;
    padding: 1px 6px; border-radius: 8px;
    background: rgba(255,255,255,0.18);
  }
  .room-btn:not(.active) .badge {
    background: var(--paper); color: var(--ink-mute);
  }
  .regal-accordion {
    background: var(--paper-2);
    border: 1px solid var(--rule);
    border-radius: 4px;
    margin-bottom: 8px;
    overflow: hidden;
    transition: box-shadow .15s ease;
  }
  .regal-accordion[open] { box-shadow: 0 2px 6px rgba(33,33,33,0.06); }
  .regal-accordion summary {
    padding: 12px 16px 12px 20px;
    cursor: pointer;
    display: flex; align-items: baseline; gap: 12px;
    list-style: none;
    transition: background .12s;
    user-select: none;
  }
  .regal-accordion summary::-webkit-details-marker { display: none; }
  .regal-accordion summary::marker { display: none; }
  .regal-accordion summary:hover { background: var(--paper-3); }
  .regal-accordion summary .regal-title {
    font-family: var(--font-display); font-weight: 500;
    font-size: 20px; color: var(--forest);
    line-height: 1;
  }
  .regal-accordion summary .count {
    font-family: var(--font-mono); font-size: 11px;
    color: var(--ink-mute); letter-spacing: 0.02em;
  }
  .regal-accordion summary .chevron {
    margin-left: auto;
    color: var(--ink-mute);
    font-family: var(--font-display);
    font-size: 18px;
    transition: transform .2s ease;
    line-height: 1;
    align-self: center;
  }
  .regal-accordion[open] summary .chevron { transform: rotate(90deg); color: var(--forest); }
  .regal-accordion .accordion-body {
    border-top: 1px solid var(--rule);
    background: var(--paper);
  }
  .regal-accordion .accordion-body .catalog {
    border: none; border-radius: 0;
  }
  /* Foto-Upload, Sektionen im Dialog */
  .form-section-title {
    grid-column: 1 / -1;
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--forest);
    padding: 6px 0 2px;
    border-top: 1px solid var(--rule);
    margin-top: 4px;
  }
  .form-section-title:first-of-type {
    border-top: none; margin-top: 0; padding-top: 0;
  }
  .field-note {
    font-size: 11px;
    color: var(--ink-mute);
    margin-top: 2px;
    font-style: italic;
  }
  .field-note.warn { color: #7a5a16; font-style: normal; }
  .field-note.warn a { color: var(--forest); text-decoration: underline; cursor: pointer; }
  .field .actions-inline {
    display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap;
  }
  .btn-untappd-inline {
    background: #FFC000; color: #000; border: 1px solid #FFC000;
    padding: 4px 10px; border-radius: 3px;
    font-size: 12px; font-weight: 500;
    display: inline-flex; align-items: center; gap: 4px;
    text-decoration: none; cursor: pointer;
  }
  .btn-untappd-inline:hover { background: #E5AC00; }
  .btn-small {
    background: transparent; color: var(--forest);
    border: 1px solid var(--rule);
    padding: 4px 10px; border-radius: 3px;
    font-size: 12px; cursor: pointer;
    font-family: var(--font-body);
  }
  .btn-small:hover { background: var(--paper-2); border-color: var(--forest); }

  /* Foto-Upload-Feld */
  .photo-slot {
    grid-column: 1 / -1;
    padding: 14px 16px;
    background: var(--paper);
    border: 1px dashed var(--rule);
    border-radius: 4px;
    display: flex; gap: 14px; align-items: center;
    min-height: 100px;
  }
  .photo-slot.has-photo { border-style: solid; }
  .photo-slot .preview {
    width: 100px; height: 100px;
    background: var(--paper-2);
    border: 1px solid var(--rule);
    border-radius: 3px;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden; flex-shrink: 0;
    background-size: cover; background-position: center;
  }
  .photo-slot .preview.empty::before {
    content: 'kein Foto';
    color: var(--ink-soft);
    font-size: 11px;
    font-family: var(--font-mono);
  }
  .photo-slot .photo-actions {
    display: flex; flex-direction: column; gap: 6px; flex: 1;
  }
  .photo-slot .photo-file-name {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-mute);
    word-break: break-all;
  }
  .photo-slot input[type=file] { display: none; }

  /* Duplikat-Warnung */
  .duplicate-warning {
    grid-column: 1 / -1;
    padding: 10px 14px;
    background: #FFF3D6;
    border-left: 3px solid #B8863B;
    border-radius: 3px;
    font-size: 13px;
    color: #7a5a16;
    margin-bottom: 4px;
  }
  .duplicate-warning strong { color: var(--forest); }

  /* Detail-Foto */
  .detail-photo-big {
    max-width: 100%;
    max-height: 400px;
    border: 1px solid var(--rule);
    border-radius: 3px;
    display: block;
    margin: 16px 0;
  }

  /* Kompakte Zeile fürs Regale-Akkordion */
  .beer-row-compact {
    padding: 9px 20px;
    display: grid;
    grid-template-columns: 68px 1fr auto;
    align-items: baseline;
    column-gap: 14px;
    cursor: pointer;
    border-bottom: 1px solid var(--rule);
    transition: background .1s ease;
  }
  .beer-row-compact:last-child { border-bottom: none; }
  .beer-row-compact:hover { background: var(--paper-3); }
  .beer-row-compact .pos-tag {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--forest);
    padding: 3px 8px;
    background: rgba(0,82,56,0.07);
    border-radius: 3px;
    text-align: center;
    letter-spacing: 0.02em;
    white-space: nowrap;
  }
  .beer-row-compact .center { min-width: 0; }
  .beer-row-compact .name {
    font-family: var(--font-display);
    font-weight: 500;
    font-size: 15px;
    color: var(--ink);
    line-height: 1.2;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .beer-row-compact .name .year {
    font-family: var(--font-mono);
    font-weight: 400;
    color: var(--ink-mute);
    font-size: 12px;
    margin-left: 6px;
  }
  .beer-row-compact .sub {
    font-family: var(--font-display);
    font-style: italic;
    font-size: 12px;
    color: var(--ink-mute);
    line-height: 1.3;
    margin-top: 1px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .beer-row-compact .right {
    text-align: right;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-mute);
    white-space: nowrap;
  }
  .beer-row-compact .right .cat {
    display: inline-block;
    padding: 1px 6px;
    background: rgba(195,158,109,0.15);
    color: var(--forest);
    border-radius: 8px;
    font-size: 10px;
    margin-right: 4px;
  }
  @media (max-width: 600px) {
    .beer-row-compact { grid-template-columns: 60px 1fr; }
    .beer-row-compact .right { grid-column: 2; text-align: left; margin-top: 2px; }
  }
  /* Zweites Akkordion pro Fach innerhalb eines Regals */
  .fach-accordion {
    border-bottom: 1px solid var(--rule);
    background: transparent;
  }
  .fach-accordion:last-child { border-bottom: none; }
  .fach-accordion summary {
    padding: 9px 20px;
    display: flex; align-items: center; gap: 10px;
    list-style: none;
    cursor: pointer;
    transition: background .12s ease;
    user-select: none;
  }
  .fach-accordion summary::marker,
  .fach-accordion summary::-webkit-details-marker { display: none; }
  .fach-accordion summary:hover { background: var(--paper-3); }
  .fach-accordion .fach-title {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--forest);
    background: rgba(0,82,56,0.07);
    padding: 3px 9px;
    border-radius: 3px;
    letter-spacing: 0.03em;
  }
  .fach-accordion .fach-count {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-mute);
  }
  .fach-accordion .chevron {
    margin-left: auto;
    color: var(--ink-mute);
    font-family: var(--font-display);
    font-size: 15px;
    transition: transform .2s ease;
    align-self: center;
  }
  .fach-accordion[open] .chevron { transform: rotate(90deg); color: var(--forest); }
  .fach-body {
    background: var(--paper-2);
    border-top: 1px solid var(--rule);
  }
  /* Position im Bier-Row innerhalb eines Fachs verstecken (steht schon im Fach-Header) */
  .fach-body .beer-row-compact {
    grid-template-columns: 1fr auto;
    padding-left: 32px;
  }
  .fach-body .beer-row-compact .pos-tag { display: none; }


  /* Regale-Ansicht */
  .location-section { margin-bottom: 40px; }
  .location-head { display: flex; align-items: baseline; gap: 14px; margin-bottom: 14px; padding-bottom: 10px; border-bottom: 1px solid var(--rule); }
  .location-head h2 { font-family: var(--font-display); font-size: 28px; font-weight: 500; color: var(--bottle); }
  .regale-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px; margin-bottom: 28px; }
  .regal-tile { display: block; padding: 14px 12px; background: var(--paper-2); border: 1px solid var(--rule); border-radius: var(--radius); text-decoration: none; color: var(--ink); text-align: center; transition: all .15s ease; }
  .regal-tile:hover { background: var(--paper-3); border-color: var(--bottle); }
  .regal-tile-name { font-family: var(--font-display); font-size: 20px; font-weight: 500; color: var(--bottle); line-height: 1; }
  .regal-tile-count { font-family: var(--font-mono); font-size: 11px; color: var(--ink-mute); margin-top: 4px; letter-spacing: 0.05em; }
  .regal-section { margin-bottom: 24px; scroll-margin-top: 20px; }
  .regal-header { display: flex; align-items: baseline; gap: 12px; padding: 10px 4px 8px; border-bottom: 1px dashed var(--rule); margin-bottom: 8px; }
  .regal-title { font-family: var(--font-display); font-size: 22px; font-weight: 500; color: var(--ink); }
  .regal-empty { padding: 20px; text-align: center; color: var(--ink-soft); font-style: italic; font-size: 13px; background: var(--paper-2); border: 1px dashed var(--rule); border-radius: var(--radius); }

  /* Toast */
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(120%); background: var(--bottle); color: var(--paper); padding: 10px 20px; border-radius: var(--radius); font-size: 13px; transition: transform .25s ease; z-index: 200; }
  .toast.show { transform: translateX(-50%) translateY(0); }

  /* First-time hint */
  .hint-banner { background: var(--amber-soft); border: 1px solid var(--amber); border-radius: var(--radius); padding: 14px 18px; margin-bottom: 20px; display: flex; gap: 12px; align-items: flex-start; }
  .hint-banner .icon { font-size: 20px; }
  .hint-banner .body { flex: 1; font-size: 13px; }
  .hint-banner strong { font-weight: 600; }

  @media (max-width: 640px) {
    .app { padding: 16px; }
    .brand-mark { font-size: 30px; }
    form.beer-form { grid-template-columns: 1fr; }
    .beer-row { grid-template-columns: 1fr; }
    .beer-right { text-align: left; }
    .detail-title { font-size: 28px; }
  }
</style>
</head>

</div>

<div class="toast" id="toast"></div>

<script>
const STORAGE_KEY = 'zusers_bierkeller_v1';
const LEGACY_STORAGE_KEY = 'bierarchiv_v1';
let state = {
  beers: [],
  view: 'catalog',
  filters: { search: '', stilStandard: '', volumen: '', land: '' },
  editingId: null,
  detailId: null,
  pairing: { food: '', beer: '' },
  gerichte: [],
  pairingSession: {}, // stilStandard → { vor:[], suppe:[], zwischen:[], haupt:[], dessert:[], kaese:[] } bereits gezeigt
  regaleRoom: 'Bierkeller',
  expandedShelves: new Set(),
  pendingPhotoData: null,   // Base64-URL für ungespeichertes Foto im Bearbeiten-Dialog
  pendingPhotoRemove: false // Merker, dass beim Speichern das Foto gelöscht werden soll
};

// ==== IndexedDB für Fotos ====
const PHOTO_DB = 'zusers_bierkeller_photos';
const PHOTO_STORE = 'photos';
let photoDbPromise = null;
function openPhotoDb() {
  if (photoDbPromise) return photoDbPromise;
  photoDbPromise = new Promise((resolve, reject) => {
    const req = indexedDB.open(PHOTO_DB, 1);
    req.onupgradeneeded = e => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains(PHOTO_STORE)) db.createObjectStore(PHOTO_STORE);
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
  return photoDbPromise;
}
async function savePhoto(id, dataUrl) {
  const db = await openPhotoDb();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(PHOTO_STORE, 'readwrite');
    tx.objectStore(PHOTO_STORE).put(dataUrl, id);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}
async function loadPhoto(id) {
  const db = await openPhotoDb();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(PHOTO_STORE, 'readonly');
    const req = tx.objectStore(PHOTO_STORE).get(id);
    req.onsuccess = () => resolve(req.result || null);
    req.onerror = () => reject(req.error);
  });
}
async function deletePhoto(id) {
  const db = await openPhotoDb();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(PHOTO_STORE, 'readwrite');
    tx.objectStore(PHOTO_STORE).delete(id);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

// ==== Bildkomprimierung ====
async function compressImage(file, maxSize = 1200, quality = 0.85) {
  const dataUrl = await new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result);
    r.onerror = rej;
    r.readAsDataURL(file);
  });
  const img = await new Promise((res, rej) => {
    const i = new Image();
    i.onload = () => res(i);
    i.onerror = rej;
    i.src = dataUrl;
  });
  const ratio = Math.min(1, maxSize / Math.max(img.width, img.height));
  const canvas = document.createElement('canvas');
  canvas.width = Math.round(img.width * ratio);
  canvas.height = Math.round(img.height * ratio);
  const ctx = canvas.getContext('2d');
  ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
  return canvas.toDataURL('image/jpeg', quality);
}

// ==== Duplikat-Erkennung: fuzzy Vergleich Name+Brauerei ====
function normalizeForCompare(s) {
  return String(s || '').toLowerCase()
    .replace(/[\s\-\.,'"()]+/g, ' ').trim();
}
function findSimilarBeers(nameStr, breweryStr, excludeId) {
  const n = normalizeForCompare(nameStr);
  const b = normalizeForCompare(breweryStr);
  if (!n) return [];
  return state.beers.filter(x => {
    if (x.id === excludeId) return false;
    const xn = normalizeForCompare(x.name);
    const xb = normalizeForCompare(x.brewery);
    // exakter Match nach Normalisierung
    if (xn === n && xb === b) return true;
    // Name identisch, Brauerei einer leer
    if (xn === n && (!b || !xb)) return true;
    return false;
  });
}

// ==== Storage ====
async function loadState() {
  try {
    const res = await fetch('bierkeller_gaeste.json');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    state.beers = Array.isArray(data) ? data : (data.biere || []);
  } catch (e) {
    console.error('JSON laden fehlgeschlagen:', e);
    toast('Bierdaten konnten nicht geladen werden.');
  }
  try {
    const res2 = await fetch('gerichte.json');
    if (res2.ok) state.gerichte = await res2.json();
  } catch (e) {
    console.warn('Gerichte laden fehlgeschlagen:', e);
  }
}
async function persist() {
  try {
    const res = await fetch('/api/beers', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(state.beers)
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const result = await res.json();
    if (result.backup) {
      console.log('Backup erstellt:', result.backup);
    }
  } catch (e) {
    toast('Speichern fehlgeschlagen: ' + e.message);
  }
}

// ==== Utils ====
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const eur = n => new Intl.NumberFormat('de-AT', {style:'currency', currency:'EUR'}).format(n || 0);
const uid = () => 'b_' + Math.random().toString(36).slice(2, 11);
const catNo = (b, i) => b.platzId || 'BA-' + String(i + 1).padStart(4, '0');
const parsePairings = s => (s || '').split(',').map(x => x.trim()).filter(Boolean);

function untappdUrl(b) {
  if (b.untappdUrl && /^https?:/.test(b.untappdUrl)) return { url: b.untappdUrl, direct: true };
  const q = [b.brewery, b.name].filter(Boolean).join(' ').trim();
  if (!q) return null;
  return { url: 'https://untappd.com/search?q=' + encodeURIComponent(q), direct: false };
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._h);
  t._h = setTimeout(() => t.classList.remove('show'), 2400);
}

function catBadge(c) {
  if (!c || c === 'Flasche') return '';
  const cls = c.startsWith('Karton') ? 'cat-karton' : (c.includes('Magnum') || c.includes('Großflasche')) ? 'cat-magnum' : c === 'Spirituose' ? 'cat-spirit' : 'status-neu';
  return `<span class="badge ${cls}">${esc(c)}</span>`;
}
function statusBadge(s) {
  if (!s || s === 'bestaetigt') return '';
  const cls = s.startsWith('bestaetigt') ? 'status-ok' : (s.startsWith('vorlaeufig') || s === 'wahrscheinlich') ? 'status-vor' : 'status-neu';
  return `<span class="badge ${cls}">${esc(s)}</span>`;
}
function locBadge(l) {
  return `<span class="badge ${l==='Bierkeller'?'loc-bk':'loc-bl'}">${esc(l)}</span>`;
}

// ==== Render ====
function render() {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === state.view && !state.detailId));
  const view = document.getElementById('view');
  if (state.detailId) view.innerHTML = renderDetail();
  else if (state.view === 'catalog') view.innerHTML = renderCatalog();
  else if (state.view === 'regale') view.innerHTML = renderRegale();
  else if (state.view === 'pairing') view.innerHTML = renderPairing();
  else if (state.view === 'stats') view.innerHTML = renderStats();
  else if (state.view === 'public') view.innerHTML = renderPublic();
  wire();
}

function renderCatalog() {
  const bk = state.beers.filter(b => b.location === 'Bierkeller' && (Number(b.quantity)||0) > 0);
  const stile = [...new Set(bk.map(b => b.stilStandard).filter(Boolean))].sort();
  const volumina = [...new Set(bk.map(b => b.volumen_ml || b.volumen).filter(Boolean))].sort((a,b) => Number(a)-Number(b));
  const laender = [...new Set(bk.map(b => b.land || b.country).filter(Boolean))].sort();
  const filtered = bk.filter(b => {
    if (state.filters.stilStandard && b.stilStandard !== state.filters.stilStandard) return false;
    if (state.filters.volumen && String(b.volumen_ml || b.volumen) !== state.filters.volumen) return false;
    if (state.filters.land && (b.land || b.country) !== state.filters.land) return false;
    if (state.filters.search) {
      const q = state.filters.search.toLowerCase();
      const hay = [b.name, b.brewery, b.style, b.stilStandard, b.land, b.country, b.vintage, b.pairings, b.notes, b.position, b.gebinde].join(' ').toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });

  const isFirstRun = state.beers.length === 0;

  let h = '';
  if (isFirstRun) {
    h += `<div class="hint-banner">
      <div class="icon">👋</div>
      <div class="body">
        <strong>Willkommen in Zusers einzigartigem Bierkeller.</strong> Laden Sie zum Start die JSON-Datei aus dem Chat über den Import-Button, oder legen Sie manuell an.
      </div>
    </div>`;
  }

  h += `<div class="toolbar">
    <input type="search" id="searchInput" placeholder="Suchen (Name, Brauerei, Position, ID…)" value="${esc(state.filters.search)}">
    <div class="spacer"></div>

  </div>`;

  if (state.beers.length) {
    h += `<div class="filters">
      <select id="filterStil">
        <option value="">Alle Bierstile</option>
        ${stile.map(s => `<option${state.filters.stilStandard===s?' selected':''}>${esc(s)}</option>`).join('')}
      </select>
      <select id="filterVolumen">
        <option value="">Alle Größen</option>
        ${volumina.map(v => `<option value="${v}"${state.filters.volumen===String(v)?' selected':''}>${v} ml</option>`).join('')}
      </select>
      <select id="filterLand">
        <option value="">Alle Länder</option>
        ${laender.map(l => `<option${state.filters.land===l?' selected':''}>${esc(l)}</option>`).join('')}
      </select>
      <div class="count">${filtered.length} von ${bk.length}</div>
    </div>`;
  }

  if (filtered.length === 0) {
    if (isFirstRun) {
      h += `<div class="empty">
        <div class="empty-icon">🍺</div>
        <h3>Ihr Keller ist noch leer</h3>
        <p>Importieren Sie die JSON-Datei aus dem Chat oder legen Sie den ersten Eintrag manuell an.</p>
        <div class="actions">
          <button class="btn btn-primary" data-action="import">JSON importieren</button>
          <button class="btn btn-ghost" data-action="new">Neuen Eintrag anlegen</button>
        </div>
      </div>`;
    } else {
      h += `<div class="empty">
        <div class="empty-icon">∅</div>
        <p>Nichts gefunden. Filter zurücksetzen oder neu anlegen.</p>
      </div>`;
    }
  } else {
    const shown = filtered.slice(0, 150);
    h += `<div class="catalog">`;
    shown.forEach(b => {
      const idx = state.beers.findIndex(x => x.id === b.id);
      const pairings = parsePairings(b.pairings);
      h += `<div class="beer-row" data-detail="${b.id}">
        <div>
          <div class="beer-head">
            <span class="beer-catno">${esc(catNo(b, idx))}</span>
            <span class="beer-name">${esc(b.name)}</span>
            ${b.vintage ? `<span class="beer-vintage">${b.vintage}</span>` : ''}

          </div>
          <div class="beer-sub">${esc(b.brewery || '—')}${b.style ? ' · ' + esc(b.style) : ''}${b.gebinde ? ' · ' + esc(b.gebinde) : ''}</div>
          ${pairings.length ? `<div class="beer-tags">${pairings.slice(0,4).map(p => `<span class="tag">${esc(p)}</span>`).join('')}${pairings.length>4?`<span class="tag-count">+${pairings.length-4}</span>`:''}</div>` : ''}
        </div>
        <div class="beer-right">
          <div class="pos">${esc(b.position || '—')}${b.lagerplaetze && b.lagerplaetze.length > 1 ? ` +${b.lagerplaetze.length - 1}` : ''}</div>
          <div>${b.quantity || 0}×</div>
        </div>
      </div>`;
    });
    if (filtered.length > 150) h += `<div class="load-more">… weitere ${filtered.length - 150} ausgeblendet – Filter verfeinern</div>`;
    h += `</div>`;
  }
  return h;
}

  if (state.beers.length === 0) {
    return `<div class="empty">

      <p>Importieren Sie zuerst die JSON-Datei im Katalog-Tab.</p>
    </div>`;
  }

  function getRegal(b) {
    const p = (b.position || '').trim();
    const m = p.match(/^(BK|BVL)\s+([A-Z])/i);
    if (m) {
      const loc = m[1].toUpperCase() === 'BK' ? 'Bierkeller' : 'Bierlagerkeller';
      return { location: loc, regal: `${m[1].toUpperCase()} ${m[2].toUpperCase()}` };
    }
    return { location: b.location || 'Ohne Zuordnung', regal: p || '(ohne Position)' };
  }
  function getFach(b) {
    const p = (b.position || '').trim();
    const m = p.match(/[A-Z](\d+)/i);
    return m ? parseInt(m[1], 10) : 999;
  }
  const anchor = r => 'regal-' + r.toLowerCase().replace(/\s+/g, '-').replace(/[^a-z0-9-]/g, '');

  // Vorabzählung pro Raum für die Buttons
  const roomCounts = { 'Bierkeller': 0, 'Bierlagerkeller': 0 };
  state.beers.forEach(b => {
    const { location } = getRegal(b);
    if (location in roomCounts) roomCounts[location]++;
  });

  if (roomCounts[state.regaleRoom] === 0) {
    if (roomCounts['Bierkeller'] > 0) state.regaleRoom = 'Bierkeller';
    else if (roomCounts['Bierlagerkeller'] > 0) state.regaleRoom = 'Bierlagerkeller';
  }
  const currentRoom = state.regaleRoom;

  // Gruppen für aktuell gewählten Raum
  const groups = {};
  state.beers.forEach(b => {
    const { location, regal } = getRegal(b);
    if (location !== currentRoom) return;
    if (!groups[regal]) groups[regal] = [];
    groups[regal].push(b);
  });
  Object.values(groups).forEach(arr => arr.sort((a, b) => {
    const fa = getFach(a), fb = getFach(b);
    if (fa !== fb) return fa - fb;
    // gleiches Fach: nach Platz-Nummer (z.B. BK A1-02 vor BK A1-03)
    const pa = (a.position || '').match(/-(\d+)$/);
    const pb = (b.position || '').match(/-(\d+)$/);
    if (pa && pb) {
      const na = parseInt(pa[1], 10), nb = parseInt(pb[1], 10);
      if (na !== nb) return na - nb;
    }
    return (a.name || '').localeCompare(b.name || '');
  }));

  const regale = Object.keys(groups).sort((a, b) => a.localeCompare(b, 'de'));
  const total = Object.values(groups).reduce((s, a) => s + a.length, 0);

  let h = '';

  // Raum-Umschalter
  h += `<div class="room-selector" role="tablist">
    <button class="room-btn active" data-room="Bierkeller" role="tab" aria-selected="true">
      Bierkeller<span class="badge">${roomCounts['Bierkeller']}</span>
    </button>
  </div>`;

  h += `<div class="location-head">
    <h2>${esc(currentRoom)}</h2>
    <span class="count">${total} ${total===1?'Eintrag':'Einträge'} · ${regale.length} ${regale.length===1?'Regal':'Regale'}</span>
  </div>`;

  // Grundriss
  if (currentRoom === 'Bierkeller') {
    const counts = {};
    regale.forEach(r => {
      const m = r.match(/^BK\s+([A-Z])$/);
      if (m) counts[m[1]] = groups[r].length;
    });
    h += renderFloorPlan(counts);
  } else if (currentRoom === 'Bierlagerkeller') {
    const counts = {};
    regale.forEach(r => {
      const m = r.match(/^BVL\s+([A-Z])$/);
      if (m) counts[m[1]] = groups[r].length;
    });
    h += renderBVLFloorPlan(counts);
  }

  // Akkordion pro Regal
  if (regale.length === 0) {
    h += `<div class="empty" style="padding:24px"><p>Keine Regale in diesem Raum.</p></div>`;
  } else {
    // Hilfsfunktionen für Fach-Gruppierung
    // Fach-Schlüssel: 'BK A 1' egal ob Position 'BK A1-02' oder 'BK A 1' oder 'BK A2' ist.
    // Für BVL: Position + Ebene wenn Ebene gepflegt, sonst nur Position.
    function fachKey(b) {
      const pos = (b.position || '').trim();
      const sub = (b.subPosition || '').trim();
      // BK: aus Position 'BK A1-02' oder 'BK A 1' oder 'BK A2' → 'BK A 1'
      const bkM = pos.match(/^BK\s+([A-Z])\s*(\d+)/i);
      if (bkM) return `BK ${bkM[1].toUpperCase()} ${bkM[2]}`;
      // BVL: Position + Ebene, bzw. Position allein
      const bvlM = pos.match(/^BVL\s+([A-Z])/i);
      if (bvlM) {
        const regalKey = `BVL ${bvlM[1].toUpperCase()}`;
        return sub ? `${regalKey} · ${sub}` : regalKey;
      }
      return pos || '(ohne Position)';
    }
    function fachDisplay(key) { return key; }
    function fachOrdinal(b) {
      const pos = (b.position || '').trim();
      const m = pos.match(/^(BK|BVL)\s+[A-Z]\s*(\d+)/i);
      if (m) return parseInt(m[2], 10);
      return 9999;
    }
    // Platz-Nummer aus 'BK A1-02' → 2, für Sortierung innerhalb Fach
    function platzOrdinal(b) {
      const pos = (b.position || '').trim();
      const m = pos.match(/-(\d+)$/);
      if (m) return parseInt(m[1], 10);
      return 999;
    }

    regale.forEach(r => {
      const bs = groups[r];
      const isOpen = state.expandedShelves.has(r);

      // Nach Fach gruppieren
      const fachGroups = {};
      bs.forEach(b => {
        const k = fachKey(b);
        if (!fachGroups[k]) fachGroups[k] = [];
        fachGroups[k].push(b);
      });
      const fachKeys = Object.keys(fachGroups).sort((a, b) => {
        const oa = fachOrdinal(fachGroups[a][0]);
        const ob = fachOrdinal(fachGroups[b][0]);
        if (oa !== ob) return oa - ob;
        return a.localeCompare(b, 'de');
      });

      h += `<details ${isOpen ? 'open' : ''} class="regal-accordion" id="${anchor(r)}" data-regal="${esc(r)}">
        <summary>
          <span class="regal-title">${esc(r)}</span>
          <span class="count">${bs.length} ${bs.length===1?'Eintrag':'Einträge'} · ${fachKeys.length} ${fachKeys.length===1?'Fach':'Fächer'}</span>
          <span class="chevron">›</span>
        </summary>
        <div class="accordion-body">
          ${fachKeys.map(fk => {
            const fachBeers = fachGroups[fk];
            const fachOpen = state.expandedShelves.has(fk);
            return `<details ${fachOpen ? 'open' : ''} class="fach-accordion" data-fach="${esc(fk)}">
              <summary>
                <span class="fach-title">${esc(fachDisplay(fk))}</span>
                <span class="fach-count">${fachBeers.length} ${fachBeers.length===1?'Bier':'Biere'}</span>
                <span class="chevron">›</span>
              </summary>
              <div class="fach-body">
                ${fachBeers.map(b => renderBeerRowCompact(b)).join('')}
              </div>
            </details>`;
          }).join('')}
        </div>
      </details>`;
    });
  }

  return h;
}

// ==== Foodpairing-Logik ====
const GANG_LABELS = { vor: 'Vorspeise', suppe: 'Suppe', zwischen: 'Zwischengang', haupt: 'Hauptgang', dessert: 'Dessert', kaese: 'Käse' };
const GANG_KEYS = Object.keys(GANG_LABELS);
const GANG_KAT = { vor: 'Vorspeisen', suppe: 'Suppen', zwischen: 'Zwischengänge', haupt: 'Hauptspeisen', dessert: 'Desserts', kaese: 'Käse' };

function gerichteByStilAndGang(stilStandard) {
  // Gibt { vor: [...], suppe: [...], ... } zurück — alle Gerichte die diesen Stil listen
  const result = {};
  GANG_KEYS.forEach(g => result[g] = []);
  if (!stilStandard || !state.gerichte.length) return result;
  state.gerichte.forEach(g => {
    if (!(g.bierstile || []).includes(stilStandard)) return;
    const kat = (g.kategorie || '').toLowerCase();
    if (kat.includes('vorsp') || kat.includes('vorspeise')) result.vor.push(g.gericht);
    else if (kat.includes('suppe')) result.suppe.push(g.gericht);
    else if (kat.includes('zwischen')) result.zwischen.push(g.gericht);
    else if (kat.includes('haupt') || kat.includes('fleisch') || kat.includes('fisch') || kat.includes('vegetar') || kat.includes('wild') || kat.includes('nudel') || kat.includes('knödel')) result.haupt.push(g.gericht);
    else if (kat.includes('dessert') || kat.includes('süß') || kat.includes('mehlsp')) result.dessert.push(g.gericht);
    else if (kat.includes('käse') || kat.includes('kaese')) result.kaese.push(g.gericht);
    else result.haupt.push(g.gericht); // Fallback
  });
  return result;
}

function pickGericht(stilStandard, gang, pool) {
  // Session-Ausschluss: bereits gezeigte überspringen, erst wenn alle durch → Reset
  if (!stilStandard || !pool.length) return null;
  const key = stilStandard + '|' + gang;
  if (!state.pairingSession[key]) state.pairingSession[key] = new Set();
  const seen = state.pairingSession[key];
  let candidates = pool.filter(g => !seen.has(g));
  if (!candidates.length) { seen.clear(); candidates = [...pool]; } // alle durch → Rotation
  // deterministisch per Stil+Gang+Seen-Größe
  const pick = candidates[seen.size % candidates.length];
  seen.add(pick);
  return pick;
}

  }

  h += `<div class="pairing-grid">

      <h3>Welche Speise zu welchem Bier?</h3>
      <div class="desc">Bier aus dem Keller eingeben → Empfehlung je Gang.</div>

      beerMatches.slice(0, 5).forEach(b => {

            <div>
              <div style="font-family:var(--font-display);font-size:16px;font-weight:600;color:var(--bottle);margin-bottom:2px">${esc(b.name)}</div>
              <div style="font-family:var(--font-mono);font-size:11px;color:var(--ink-soft);margin-bottom:10px">${esc(b.brewery||'')}${stil ? ' · ' + esc(stil) : ''}</div>

            ${stil ? `<button class="btn btn-ghost" data-reroll="${esc(stil)}" style="padding:3px 10px;font-size:12px" title="Neue Vorschläge">↺</button>` : ''}
          </div>`;
        if (!stil) {
          h += `<div style="color:var(--ink-mute);font-size:12px;font-style:italic">Kein Standardstil hinterlegt.</div>`;
        } else if (!pool || GANG_KEYS.every(g => !pool[g].length)) {
          h += `<div style="color:var(--ink-mute);font-size:12px;font-style:italic">Keine Gerichte für „${esc(stil)}" in der Datenbank.</div>`;
        } else {
          GANG_KEYS.forEach(g => {
            const pick = pool[g].length ? pickGericht(stil, g, pool[g]) : null;
            h += `<div style="display:flex;gap:8px;margin-bottom:5px;font-size:13px">
              <span style="font-family:var(--font-mono);font-size:11px;color:var(--gold);min-width:90px;padding-top:1px">${GANG_LABELS[g]}</span>
              <span style="color:${pick ? 'var(--ink)' : 'var(--ink-mute)'};font-style:${pick ? 'normal' : 'italic'}">${pick ? esc(pick) : '–'}</span>
            </div>`;
          });
        }
        h += `</div>`;
      });
      if (beerMatches.length > 5) h += `<div style="color:var(--ink-mute);font-size:12px;padding:4px 0">… und ${beerMatches.length - 5} weitere Treffer. Suche verfeinern.</div>`;
    }
  } else {
    h += `<div style="color:var(--ink-mute);font-style:italic;padding:12px 0">Bier oben eintippen.</div>`;
  }

  h += `</div></div>

    <div class="pairing-col">
      <h3>Welches Bier zu welcher Speise?</h3>
      <div class="desc">Gericht eingeben → passende Biere aus dem Keller.</div>
      <input type="search" id="foodInput" placeholder="z. B. Wildragout, Blauschimmelkäse…" value="${esc(state.pairing.food)}">
      <div style="margin-top:12px">`;

  if (fq && fq.length >= 3) {
    // Gerichte suchen die den Suchbegriff enthalten
    const gerichtMatches = state.gerichte.filter(g => g.gericht.toLowerCase().includes(fq));
    if (!gerichtMatches.length) {
      h += `<div style="color:var(--ink-mute);font-style:italic;padding:12px 0">Kein Gericht gefunden.</div>`;
    } else {
      // Stile sammeln
      const stileForFood = [...new Set(gerichtMatches.flatMap(g => g.bierstile || []))];
      // Biere im Keller mit passendem stilStandard
      const beerResults = state.beers.filter(b => b.stilStandard && stileForFood.includes(b.stilStandard) && (b.quantity||0) > 0);
      if (!beerResults.length) {

        });

    h += `<div style="color:var(--ink-mute);font-style:italic;padding:12px 0">Mindestens 3 Zeichen eingeben.</div>`;
  } else {
    h += `<div style="color:var(--ink-mute);font-style:italic;padding:12px 0">Speise oben eintippen.</div>`;
  }

  h += `</div></div></div>`;
  return h;
}

function renderStats() {
  const biere = state.beers.filter(b => b.location === 'Bierkeller' && (Number(b.quantity)||0) > 0);
  const total = biere.reduce((s,b) => s + (Number(b.quantity)||0), 0);
  const unique = biere.length;
  const withPair = biere.filter(b => parsePairings(b.pairings).length).length;

  const styles = {}, brews = {}, lands = {}, stilStds = {};
  biere.forEach(b => {
    const s = b.style || 'ohne Angabe'; styles[s] = (styles[s]||0) + 1;
    if (b.brewery) brews[b.brewery] = (brews[b.brewery]||0) + 1;
    const l = b.land || b.country || ''; if (l) lands[l] = (lands[l]||0) + 1;
    const sd = b.stilStandard || ''; if (sd) stilStds[sd] = (stilStds[sd]||0) + 1;
  });
  const styleL  = Object.entries(styles).sort((a,b) => b[1]-a[1]).slice(0,15);
  const brewL   = Object.entries(brews).sort((a,b) => b[1]-a[1]).slice(0,15);
  const landL   = Object.entries(lands).sort((a,b) => b[1]-a[1]);
  const stilL   = Object.entries(stilStds).sort((a,b) => b[1]-a[1]).slice(0,20);
  const maxS = Math.max(1, ...styleL.map(([,n]) => n));
  const maxB = Math.max(1, ...brewL.map(([,n]) => n));
  const maxL = Math.max(1, ...landL.map(([,n]) => n));
  const maxSt = Math.max(1, ...stilL.map(([,n]) => n));

  const card = (label, val, sub, amber) => `<div class="stat-card${amber?' amber':''}">
    <div class="stat-label">${label}</div>
    <div class="stat-value">${val}${sub?` <span class="unit">${sub}</span>`:''}</div>
  </div>`;

  let h = `<div class="stats-grid">
    ${card('Verschiedene Biere', unique)}
    ${card('Flaschen gesamt', total, 'Einh.')}
    ${card('Mit Foodpairings', `${withPair}/${unique}`)}
    ${card('Bierstile', Object.keys(stilStds).length)}
    ${card('Länder', Object.keys(lands).length)}
  </div>`;

  if (stilL.length) {
    h += `<div class="breakdown-title">Nach Bierstil<span class="sub">(Top 20)</span></div><div class="breakdown">`;
    stilL.forEach(([s,n]) => {
      h += `<div class="breakdown-row" style="cursor:pointer" onclick="state.filters.stilStandard='${s.replace(/'/g,"\\'")}';state.view='catalog';render()"><div class="breakdown-label">${esc(s)}</div><div class="breakdown-bar"><div class="breakdown-bar-fill" style="width:${(n/maxSt*100).toFixed(0)}%"></div></div><div class="breakdown-count">${n}</div></div>`;
    });
    h += `</div>`;
  }

  if (landL.length) {
    h += `<div class="breakdown-title">Nach Land</div><div class="breakdown">`;
    landL.forEach(([s,n]) => {
      h += `<div class="breakdown-row" style="cursor:pointer" onclick="state.filters.land='${s.replace(/'/g,"\\'")}';state.view='catalog';render()"><div class="breakdown-label">${esc(s)}</div><div class="breakdown-bar"><div class="breakdown-bar-fill amber" style="width:${(n/maxL*100).toFixed(0)}%"></div></div><div class="breakdown-count">${n}</div></div>`;
    });
    h += `</div>`;
  }

  if (brewL.length) {
    h += `<div class="breakdown-title">Nach Brauerei<span class="sub">(Top 15)</span></div><div class="breakdown">`;
    brewL.forEach(([s,n]) => {
      h += `<div class="breakdown-row"><div class="breakdown-label">${esc(s)}</div><div class="breakdown-bar"><div class="breakdown-bar-fill" style="width:${(n/maxB*100).toFixed(0)}%"></div></div><div class="breakdown-count">${n}</div></div>`;
    });
    h += `</div>`;
  }

  return h;
}

        <div class="public-item-brewery">${esc(b.brewery||'')}${b.style ? ' · ' + esc(b.style) : ''}</div>
        ${p.length ? `<div class="public-item-pair"><span class="lbl">Passt zu:</span> ${esc(p.join(', '))}</div>` : ''}
        ${utd ? `<div style="margin-top:6px"><a href="${esc(utd.url)}" target="_blank" rel="noopener" style="color:var(--amber);font-size:12px;text-decoration:none">Auf Untappd →</a></div>` : ''}
      </div>`;
    });
    h += `</div>`;
  } else {
    h += `<div class="empty"><div class="empty-icon">🌐</div><h3>Noch nichts markiert</h3><p>Öffnen Sie ein Bier und aktivieren Sie „Auf der Webseite veröffentlichen".</p></div>`;
  }
  return h;
}

// ==== Actions ====
function openModal(beer) {
  state.editingId = beer ? beer.id : null;
  document.getElementById('modalTitle').textContent = beer ? 'Eintrag bearbeiten' : 'Neuer Eintrag';
  const form = document.getElementById('beerForm');
  form.reset();
  if (beer) {
    ['name','brewery','style','category','gebinde','platzId','position','subPosition','status','vintage','mhdJahrgang','quantity','value','pairings','untappdUrl','photo','link','notes','stilStandard'].forEach(k => {
      if (form.elements[k] && beer[k] != null) form.elements[k].value = beer[k];
    });
    // Standardstil-Datalist befüllen
    const dl = document.getElementById('stdStiles');
    if (dl && state.gerichte.length) {
      const stile = [...new Set(state.gerichte.flatMap(g => g.bierstile||[]))].sort();
      dl.innerHTML = stile.map(s => `<option value="${esc(s)}">`).join('');
    }
    form.elements.location.value = beer.location || 'Bierkeller';
    form.elements.publish.checked = !!beer.publish;
  } else {
    form.elements.category.value = 'Flasche';
    form.elements.location.value = 'Bierkeller';
    form.elements.quantity.value = 1;
  }
  document.getElementById('modal').classList.add('open');
}

function closeModal() {
  document.getElementById('modal').classList.remove('open');
  state.editingId = null;
}

function saveBeer(ev) {
  ev.preventDefault();
  const f = ev.target;
  const data = {
    name: f.name.value.trim(),
    brewery: f.brewery.value.trim(),
    style: f.style.value.trim(),
    category: f.category.value.trim() || 'Flasche',
    gebinde: f.gebinde.value.trim(),
    platzId: f.platzId.value.trim(),
    vintage: f.vintage.value ? Number(f.vintage.value) : null,
    mhdJahrgang: f.mhdJahrgang.value.trim(),
    location: f.location.value,
    position: f.position.value.trim(),
    subPosition: f.subPosition.value.trim(),
    status: f.status.value.trim(),
    quantity: f.quantity.value ? Number(f.quantity.value) : 0,
    value: f.value.value ? Number(f.value.value) : 0,
    pairings: f.pairings.value.trim(),
    stilStandard: f.stilStandard.value.trim(),
    untappdUrl: f.untappdUrl.value.trim(),
    photo: f.photo.value.trim(),
    link: f.link.value.trim(),
    notes: f.notes.value.trim(),
    publish: f.publish.checked
  };
  if (state.editingId) {
    const i = state.beers.findIndex(b => b.id === state.editingId);
    if (i >= 0) state.beers[i] = { ...state.beers[i], ...data };
    toast('Gespeichert');
  } else {
    state.beers.push({ ...data, id: uid() });
    toast('Angelegt');
  }
  persist();
  closeModal();
  render();
  return false;
}

function handleAction(action, id) {
  if (action === 'new') openModal();
  else if (action === 'edit') {
    const b = state.beers.find(x => x.id === id);
    if (b) openModal(b);
  }
  else if (action === 'delete') {
    const b = state.beers.find(x => x.id === id);
    if (!b) return;
    if (!confirm(`„${b.name}" wirklich löschen?`)) return;
    state.beers = state.beers.filter(x => x.id !== id);
    persist();
    state.detailId = null;
    toast('Gelöscht');
    render();
  }
  else if (action === 'back') { state.detailId = null; render(); }
  else if (action === 'export' || action === 'export-json') exportJSON();
  else if (action === 'export-html') exportHTML();
  else if (action === 'import') importJSON();
  else if (action === 'importGerichte') importGerichte();
}

function exportJSON() {
  const blob = new Blob([JSON.stringify(state.beers, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'zusers-bierkeller-' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
  URL.revokeObjectURL(url);
  toast('Export heruntergeladen');
}

function exportHTML() {
  const pub = state.beers.filter(b => b.publish);
  const html = `<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><title>Zusers einzigartiger Bierkeller</title><link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Ropa+Sans&display=swap" rel="stylesheet"><style>body{font-family:'Ropa Sans',sans-serif;max-width:800px;margin:40px auto;padding:0 20px;color:#212121;background:#F0EDE8}h1{font-family:'Lora',Georgia,serif;font-size:35px;color:#005238;border-bottom:1px solid #C8C3B8;padding-bottom:14px;font-weight:500}h1 em{font-style:italic;color:#c39e6d;font-weight:400}.item{padding:16px 0;border-bottom:1px solid #C8C3B8}.name{font-family:'Lora',serif;font-size:22px;font-weight:500}.year{font-family:monospace;color:#7a7a7a;font-weight:400;font-size:16px}.brewery{font-family:'Lora',serif;font-style:italic;color:#7a7a7a;margin-top:4px}.pair{margin-top:8px;font-size:14px}.utd{margin-top:6px}.utd a{color:#c39e6d;text-decoration:none;font-size:13px;font-weight:500}</style></head><body><h1>Zusers <em>einzigartiger</em> Bierkeller</h1>${pub.map(b => {
    const p = parsePairings(b.pairings);
    const utd = untappdUrl(b);
    return `<div class="item"><div class="name">${esc(b.name)} ${b.vintage?`<span class="year">${b.vintage}</span>`:''}</div><div class="brewery">${esc(b.brewery||'')}${b.style?' · '+esc(b.style):''}</div>${p.length?`<div class="pair"><strong>Passt zu:</strong> ${esc(p.join(', '))}</div>`:''}${utd?`<div class="utd"><a href="${esc(utd.url)}">Auf Untappd →</a></div>`:''}</div>`;
  }).join('')}</body></html>`;
  const blob = new Blob([html], { type: 'text/html' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'zusers-bierkeller-public.html';
  a.click();
  URL.revokeObjectURL(url);
  toast('HTML-Export heruntergeladen');
}

function importJSON() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'application/json,.json';
  input.onchange = async e => {
    const file = e.target.files[0];
    if (!file) return;
    try {
      const text = await file.text();
      const data = JSON.parse(text);
      if (!Array.isArray(data)) throw new Error('Ungültiges Format');
      if (state.beers.length && !confirm(`${state.beers.length} bestehende Einträge werden ersetzt. Fortfahren?`)) return;
      state.beers = data.map(b => ({ ...b, id: b.id || uid() }));
      persist();
      render();
      toast(`${state.beers.length} Einträge importiert`);
    } catch (err) {
      toast('Import fehlgeschlagen: ' + err.message);
    }
  };
  input.click();
}

function importGerichte() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'application/json,.json';
  input.onchange = async e => {
    const file = e.target.files[0];
    if (!file) return;
    try {
      const text = await file.text();
      const data = JSON.parse(text);
      if (!Array.isArray(data)) throw new Error('Ungültiges Format');
      state.gerichte = data;
      const res = await fetch('/api/gerichte', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      state.pairingSession = {};
      render();
      toast(`${data.length} Gerichte importiert`);
    } catch (err) {
      toast('Gerichte-Import fehlgeschlagen: ' + err.message);
    }
  };
  input.click();
}

// ==== Events ====
function wire() {
  // Raum-Umschalter im Regale-Tab
  document.querySelectorAll('[data-room]').forEach(el => {
    el.addEventListener('click', () => {
      state.regaleRoom = el.dataset.room;
      render();
      setTimeout(() => document.querySelector('.room-selector')?.scrollIntoView({behavior:'smooth', block:'start'}), 30);
    });
  });
  // Akkordion-Zustand mitspeichern (Regal + Fach)
  document.querySelectorAll('.regal-accordion').forEach(det => {
    det.addEventListener('toggle', () => {
      const key = det.dataset.regal;
      if (!key) return;
      if (det.open) state.expandedShelves.add(key);
      else state.expandedShelves.delete(key);
    });
  });
  document.querySelectorAll('.fach-accordion').forEach(det => {
    det.addEventListener('toggle', () => {
      const key = det.dataset.fach;
      if (!key) return;
      if (det.open) state.expandedShelves.add(key);
      else state.expandedShelves.delete(key);
    });
  });
  // Klick im Grundriss öffnet das Akkordion und scrollt hin
  document.querySelectorAll('.shelf-link').forEach(link => {
    link.addEventListener('click', e => {
      const href = link.getAttribute('href') || link.getAttribute('xlink:href');
      if (!href || !href.startsWith('#')) return;
      e.preventDefault();
      const target = document.getElementById(href.slice(1));
      if (!target) return;
      if (target.tagName === 'DETAILS') {
        target.open = true;
        const key = target.dataset.regal;
        if (key) state.expandedShelves.add(key);
      }
      setTimeout(() => target.scrollIntoView({behavior:'smooth', block:'start'}), 30);
    });
  });
  document.querySelectorAll('[data-detail]').forEach(el => {
    el.addEventListener('click', () => { state.detailId = el.dataset.detail; render(); window.scrollTo(0,0); });
  });
  document.querySelectorAll('[data-reroll]').forEach(el => {
    el.addEventListener('click', e => {
      e.stopPropagation();
      const stil = el.dataset.reroll;
      // Alle Session-Keys für diesen Stil löschen → neue Vorschläge
      Object.keys(state.pairingSession).forEach(k => { if (k.startsWith(stil + '|')) delete state.pairingSession[k]; });
      render();
    });
  });
  document.querySelectorAll('[data-action]').forEach(el => {
    el.addEventListener('click', e => {
      e.stopPropagation();
      handleAction(el.dataset.action, el.dataset.id);
    });
  });

  const s = document.getElementById('searchInput');
  if (s) s.oninput = e => { state.filters.search = e.target.value; render(); const el = document.getElementById('searchInput'); if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); } };
  const fstil = document.getElementById('filterStil');
  if (fstil) fstil.onchange = e => { state.filters.stilStandard = e.target.value; render(); };
  const fvol = document.getElementById('filterVolumen');
  if (fvol) fvol.onchange = e => { state.filters.volumen = e.target.value; render(); };
  const fland = document.getElementById('filterLand');
  if (fland) fland.onchange = e => { state.filters.land = e.target.value; render(); };
  const f = document.getElementById('foodInput');
  if (f) f.oninput = e => { state.pairing.food = e.target.value; render(); const el = document.getElementById('foodInput'); if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); } };
  const be = document.getElementById('beerInput');
  if (be) be.oninput = e => { state.pairing.beer = e.target.value; render(); const el = document.getElementById('beerInput'); if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); } };
}

document.getElementById('tabs').addEventListener('click', e => {
  if (e.target.classList.contains('tab')) {
    state.view = e.target.dataset.tab;
    state.detailId = null;
    render();
  }
});

document.getElementById('modal').addEventListener('click', e => {
  if (e.target.id === 'modal') closeModal();
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (document.getElementById('modal').classList.contains('open')) closeModal();
    else if (state.detailId) { state.detailId = null; render(); }
  }
});

// Init: Daten vom Server laden, dann rendern
loadState().then(() => render());
</script>
</body>
</html>
